[package]
name = "tauri-plugin-harbor-android-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
links = "tauri-plugin-harbor-android-updater"
description = "Private Android installer bridge for Warren"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

