# Add this location to the EXISTING HTTPS virtual host. Keep its TLS and /api/ws configuration.
location /warren/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
    client_max_body_size 512k;
    # Authorization is forwarded by nginx; never put it in access-log formats.
}
