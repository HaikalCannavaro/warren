name: Release Warren

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, for example v0.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: warren-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reject reused versions and mismatched tags
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build

  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the existing production updater key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?Configure the existing TAURI_SIGNING_PRIVATE_KEY repository secret; do not generate a replacement key.}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build and sign updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:release -- --ci --bundles nsis
      - name: Collect installer and signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0].FullName
          if (-not (Test-Path -LiteralPath ($installer + '.sig'))) { throw 'Missing updater signature.' }
          New-Item -ItemType Directory -Force -Path 'artifacts/windows' | Out-Null
          Copy-Item -LiteralPath $installer -Destination 'artifacts/windows/Warren-windows-x64-setup.exe'
          Copy-Item -LiteralPath ($installer + '.sig') -Destination 'artifacts/windows/Warren-windows-x64-setup.exe.sig'
      - uses: actions/upload-artifact@v4
        with:
          name: warren-windows-release
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build and sign Android APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
      BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require the existing Android release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Configure the original Android keystore; a new key cannot update existing installations.}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-28
      - run: npm ci
      - name: Generate Android project and Warren icons
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          npm run icons:generate
      - name: Build universal release APK
        run: npm run android:release -- --ci
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/warren-android.jks" "$RUNNER_TEMP/warren-aligned.apk"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/warren-android.jks"
          unset ANDROID_KEYSTORE_BASE64
          apk='src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk'
          test -s "$apk"
          mkdir -p artifacts/android
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/warren-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/warren-android.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out artifacts/android/Warren-android.apk "$RUNNER_TEMP/warren-aligned.apk"
          "$tools/apksigner" verify --verbose artifacts/android/Warren-android.apk
          "$tools/zipalign" -c -P 16 -v 4 artifacts/android/Warren-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: warren-android-release
          path: artifacts/android/Warren-android.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify both platforms and publish stable update
    needs: [prepare, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: warren-windows-release
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: warren-android-release
          path: artifacts/android
      - name: Check tag and version again before creating release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-release.mjs
      - name: Package installer, APK, and signed update manifests
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:package -- --repository "$GITHUB_REPOSITORY" --windows artifacts/windows/Warren-windows-x64-setup.exe --android artifacts/android/Warren-android.apk --notes RELEASE_NOTES.md
      - name: Create draft without overwriting any existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: npm run release:publish -- --directory "release/$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: warren-complete-release
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify uploaded signatures and hashes, then activate in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/promote-release.mjs "release/$RELEASE_TAG"
      - name: Report publication
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "## Warren $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Both signed platform packages were uploaded, downloaded again, and verified before stable publication. Windows and Android in-app update feeds now target this release. Physical-device upgrade testing remains a separate check." >> "$GITHUB_STEP_SUMMARY"
